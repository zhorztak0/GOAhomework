<!-- 4. შექმენი ორი ფაილი: index.html და style.css.
- დააკავშირე style.css ფაილი HTML-თან <link> ტეგის გამოყენებით.
- style.css-ში გააფორმე <h1> და <p>.
- გამოიყენე:
  • font-size
  • background-color
  • border
--> 


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <h2>Hello world</h2>
    <p>This is paragraph</p>
</body>
</html>
