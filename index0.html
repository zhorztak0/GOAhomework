<!-- 3. შექმენი HTML გვერდი, სადაც გამოიყენებ Internal CSS-ს.
- გამოიყენე <style> ტეგი.
- გააფორმე <h1> და <p>.
- გამოიყენე:
  • font-size
  • background-color
  • border -->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {font-size: larger;background-color: brown;border: chartreuse;}
        p {font-size: xx-large; background-color: aqua; border: black;}
    </style>
</head>
<body>
    <h1>computer</h1>
    <p>hi</p>
</body>
</html>
