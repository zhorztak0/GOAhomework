<html>
    <head>
        <title>Form</title>
    </head>

    <body>
        <h1>Registration Form</h1>
        <form>
            <label for="input_1">First Name:</label>
            <input type="text" id="input_1" placeholder="Enter First Name">

            <br>

            <label for="input_2">Last Name:</label>
            <input type="text" id="input_2" placeholder="Enter Last Name">

            <br>

            <label for="input_3">Email:</label>
            <input type="email" id="input_3" placeholder="Enter Email Address">

            <br>

            <label for="input_4">Password:</label>
            <input type="password" id="input_4">
            
        </form>

    </body>
</html>
