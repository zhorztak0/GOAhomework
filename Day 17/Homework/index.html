input-ებისთვის და გმოიყენეთ შესაბამისი იარლიყებიც(label).-->

<html>
    <head>
        <title>Form</title>
    </head>

    <body>
        <form>
            <label for="input_1">Full Name:</label>
            <input type="" id="input_1" placeholder="Full Name...">

            <br>

            <label for="input_2">Email:</label>
            <input type="email" id="input_2" placeholder="Email...">

            <br>

            <label for="input_3">Password</label>
            <input type="password" id="input_3" placeholder="Password...">
        </form>
    </body>
</html>
