<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #title{
            color: blue;
        }

        .p{
            color: darkgreen;
        }
    </style>
</head>
<body>
    <h1 id="title">My short web-site</h1>
    <p class="p">Hello</p>
    <p class="p">Bye</p>
</body>
</html>
