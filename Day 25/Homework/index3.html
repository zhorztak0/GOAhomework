<!-- 3) შექმენი სექცია <section>, რომლის შიგნითაც მოათავსებ სტატიას <article>. სტატიაში ჩასვი სათაური "თავი 1" და ერთი აბზაცი <p> ტექსტით. 
style ატრიბუტით შეუცვალე მთლიან სექციას ფონის ფერი (background-color), ხოლო აბზაცის ტექსტის ფონტი გახადე დიდი (font-size: xx-large).-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <section style="background-color: lightblue;">
            <article>
                <h1>თავი 1</h1>
                <p style="font-size: xx-large;">ტექნოლოგიების განვითარებამ მნიშვნელოვნად შეცვალა თანამედროვე საზოგადოება. დღეს ინფორმაციის მიღება, სწავლა და კომუნიკაცია გაცილებით მარტივი და სწრაფია, ვიდრე წარსულში.</p>
            </article>
        </section>
    </main>
</body>
</html>
