<!--2) შექმენი საიტის ზედა ნაწილი <header> თეგით. შიგნით ჩასვი სათაური <h1> საიტის სახელით. style ატრიბუტით მიეცი სათაურს წითელი ფერი, 
ტექსტის ზომა და შემოავლე წყვეტილი ჩარჩო (border: 2px solid black;).-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1 style="color: red; font-size: larger;border: 2px solid black;">Delicious food</h1>
    </header>
</body>
</html>
