<!-- 4) შექმენი ძირითადი ნაწილი <main> რაიმე ტექსტით და მის ქვემოთ დაამატე მეორეხარისხოვანი ინფორმაციის თეგი <aside>. style ატრიბუტის გამოყენებით 
<aside> თეგს მიეცი მწვანე ტექსტის ფერი, ყვითელი ფონის ფერი და სქელი ჩარჩო (border: 4px solid green;).-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <h1>კომპიუტერები</h1>
        <p> კომპიუტერი არის თანამედროვე ტექნოლოგია, რომელიც გვეხმარება ინფორმაციის მოძიებაში, მუშაობაში და სწავლაში.</p>

        <aside style="color: green;background-color: yellow;border: 4px solid green;">
            <h3>დამატებითი ინფორმაცია</h3>
            <p> პირველი კომპიუტერები ძალიან დიდი ზომის იყო და ნაკლებად სწრაფად მუშაობდა.</p>
        </aside>
    </main>
</body>
</html>
