<!-- 1. HTML ფაილის დასაწყისში კომენტარის  სახით ახსენი:
- რა არის Inline CSS;
- რა არის Internal CSS;
- რა არის External CSS. -->

<!--

Inline CSS -  იწერება body-ში style ატრიბუტის გამოყენებით
Internal CSS- იწერება head-ში style ატრიბუტის გამოყენებით
EXternal CSS - იწერება CSS და HTMl ლინკის დახმარებით შეიძლება დაკავშირება
-->

<!-- 
2. შექმენი HTML გვერდი, სადაც გამოიყენებ Inline CSS-ს.
- დაამატე <h1> და <p>.
- გამოიყენე:
  • font-size
  • background-color
  • border -->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="font-size: medium;background-color:red;border: white;">Hello</h1>
    <p>Word</p>
</body>
</html>
