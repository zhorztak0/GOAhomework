<!-- 

header - თეგში ათავსებენ საითის ლოგოს,ნავიგაციას
nav - ლინკის ადგილი
section - დასაყოფად
article - დამოუკიდებელი ტექსტისთვის
aside - გვერდითი ინფორმაცია
footer - მოკლე ინფორმაცია საიტზე ასევე ნომრები

body- იწერება გვერდის შინაარსი
-->>
