<!-- 
2) კომენტარების სახით ახსენით რა არის RGB პალიტრა და HEX კოდების სისტემა.
 
RGB პალიტრა არის სისტემა,რომელიც ნებისმიერი ფერს ქმნის სამი ძირითადი ფერის — წითლის, მწვანისა და ლურჯის გამოყენებით.
იწყება 0-დან 255-მდე.
HEX კოდების სისტემაც ფერებისთვი გამოიყენება უბრალოდ არის მოკლე.იწყება #-ით და შემდეგ 6 სიმბოლისგან - #FF0000.
FF არის 255 და 00 არის მინიმუმი.
-->


<!-- 3) შექმენით ერთი ცალი h1 ელემენტი და მიანიჭეთ ფერი HEX კოდის სისტემით.-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: #631c23;
        }
    </style>
</head>
<body>
    <h1>Hello</h1>
</body>
</html>


<!--4) შექმენით 10 პარაგრაფი. პირველ ხუთს შეუცვალეთ ფერი RGB პალიტრის საშუალებით, ბოლო დანარჩენ ხუთს კი HEX კოდით.-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p style="color: rgb(255, 0, 0);">First paragraph</p>
    <p style="color: rgb(0, 128, 0);">Second paragraph</p>
    <p style="color: rgb(0, 0, 255);">Third paragraph</p>
    <p style="color: rgb(255, 165, 0);">Fourth paragraph</p>
    <p style="color: rgb(128, 0, 128);">Fifth paragraph</p>
    <p style="color: #ff0000;">Sixth paragraph</p>
    <p style="color: #008000;">Seventh paragraph</p>
    <p style="color: #0000ff;">Eighth paragraph</p>
    <p style="color: #ffa500;">Ninth paragraph</p>
    <p style="color: #800080;">Tenth paragraph</p>
</body>
</html>
