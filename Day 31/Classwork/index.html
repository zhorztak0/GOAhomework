<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .first {
            color: red;
        }

        .second {
            color: rgb(0, 0, 255);
        }

        .third {
            color: #800080;
        }
    </style>
</head>
<body>
    <p class="first">პირველი პარაგრაფი</p>
    <p class="first">მეორე პარაგრაფი</p>
    <p class="first">მესამე პარაგრაფი</p>
    <p class="first">მეოთხე პარაგრაფი</p>
    <p class="first">მეხუთე პარაგრაფი</p>

    <p class="second">მეექვსე პარაგრაფი</p>
    <p class="second">მეშვიდე პარაგრაფი</p>
    <p class="second">მერვე პარაგრაფი</p>
    <p class="second">მეცხრე პარაგრაფი</p>
    <p class="second">მეათე პარაგრაფი</p>


    <p class="third">მეთერთმეტე პარაგრაფი</p>
    <p class="third">მეთორმეტე პარაგრაფი</p>
    <p class="third">მეცამეტე პარაგრაფი</p>
    <p class="third">მეთოთხმეტე პარაგრაფი</p>
    <p class="third">მეთხუთმეტე პარაგრაფი</p>


</body>
</html>


<!--
2) მიუწერეთ შესაბამის პალიტრებს ფერები:
rgb(0,0,0) - შავი
rgb(0,255,0) -მწვანე
rgb(255,255,255) -თეთრი
rgb(255,0,0) -წითელი
rgb(0,0,255) -ლურჯი
